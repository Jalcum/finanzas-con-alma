<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas con Alma | Control de Abundancia</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --alma-oro: #d4af37; --alma-verde: #1e3d1a; --texto: #1e293b; --rojo: #ef4444; --verde-claro: #22c55e; }
        body { font-family: 'Segoe UI', sans-serif; background: #fcfaf2; margin: 0; padding: 0; color: var(--texto); }
        
        /* LANDING PAGE */
        .hero { background: linear-gradient(135deg, var(--alma-verde), #0a1a08); color: white; padding: 50px 20px; text-align: center; border-bottom: 5px solid var(--alma-oro); }
        .hero h1 { font-size: 2.2rem; margin-bottom: 10px; color: var(--alma-oro); }
        
        .sales-container { max-width: 800px; margin: -30px auto 40px; background: white; padding: 30px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; border: 1px solid var(--alma-oro); position: relative; z-index: 10; }
        .btn-buy { background: #25D366; color: white; padding: 18px 35px; border-radius: 50px; text-decoration: none; font-size: 1.3rem; font-weight: bold; display: inline-block; transition: 0.3s; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4); border: none; cursor: pointer; }
        .btn-buy:hover { transform: scale(1.05); background: #128C7E; }

        /* APP SECTION */
        .app-section { max-width: 1100px; margin: 20px auto; padding: 20px; display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .full-width { grid-column: span 2; }

        /* FILTROS */
        .filter-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn-filter { padding: 8px 15px; border: 1px solid var(--alma-oro); background: white; border-radius: 20px; cursor: pointer; font-size: 0.8rem; }
        .btn-filter.active { background: var(--alma-oro); color: white; }

        /* FORMULARIOS */
        .form-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        input, select { padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 1rem; width: 100%; box-sizing: border-box; }
        .btn-add { background: var(--alma-verde); color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        
        /* LISTA */
        .list-container { max-height: 300px; overflow-y: auto; margin-top: 10px; }
        .item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; }
        .item.ingreso { border-left: 5px solid var(--verde-claro); }
        .item.gasto { border-left: 5px solid var(--rojo); }

        @media (max-width: 768px) { .app-section { grid-template-columns: 1fr; } .full-width { grid-column: span 1; } }
    </style>
</head>
<body>

    <header class="hero">
        <h1>✨ Finanzas con Alma</h1>
        <p>Tu herramienta diaria hacia la libertad financiera</p>
    </header>

    <div class="sales-container">
        <h3>Adquiere la Guía Maestra PDF</h3>
        <p>Aprende el método exacto y recibe soporte personalizado.</p>
        <input type="email" id="cliente-email" placeholder="Tu correo electrónico" style="max-width: 300px; margin-bottom: 15px; border: 2px solid var(--alma-oro); padding: 10px; border-radius: 10px;">
        <br>
        <button onclick="contactarVendedor()" class="btn-buy">
            <i class="fab fa-whatsapp"></i> COMPRAR POR WHATSAPP
        </button>
    </div>

    <div class="app-section" id="app-area">
        <div class="card">
            <h3>Nuevo Registro</h3>
            <div class="form-group">
                <input type="text" id="mov-desc" placeholder="¿Qué ingreso o gasto tuviste?">
                <input type="number" id="mov-monto" placeholder="Monto (ej: 50.00)">
                <select id="mov-tipo">
                    <option value="ingreso">🟢 Ingreso</option>
                    <option value="gasto">🔴 Gasto</option>
                </select>
                <button class="btn-add" onclick="agregarMovimiento()">Guardar en mi Historial</button>
            </div>
        </div>

        <div class="card">
            <h3>Resumen Visual</h3>
            <div class="filter-bar">
                <button class="btn-filter active" onclick="cambiarFiltro('semana', this)">Semana</button>
                <button class="btn-filter" onclick="cambiarFiltro('mes', this)">Mes</button>
                <button class="btn-filter" onclick="cambiarFiltro('año', this)">Año</button>
            </div>
            <div style="display: flex; justify-content: space-around; text-align: center; margin-bottom: 15px;">
                <div><small>Ingresos</small><div id="res-ingresos" style="color:var(--verde-claro); font-weight:bold;">$0</div></div>
                <div><small>Gastos</small><div id="res-gastos" style="color:var(--rojo); font-weight:bold;">$0</div></div>
            </div>
            <canvas id="chartMovimientos" style="max-height: 180px;"></canvas>
        </div>

        <div class="card full-width">
            <h3>Historial Reciente</h3>
            <div id="listaMovimientos" class="list-container"></div>
            <button class="btn-add" style="background:#64748b; margin-top:15px; width: auto;" onclick="descargarPDF()">
                <i class="fas fa-file-pdf"></i> Descargar Reporte PDF
            </button>
        </div>
    </div>

    <script>
        let movimientos = JSON.parse(localStorage.getItem('alma_movimientos')) || [];
        let filtroActual = 'semana';
        let miChart = null;

        function agregarMovimiento() {
            const descInput = document.getElementById('mov-desc');
            const montoInput = document.getElementById('mov-monto');
            const tipoInput = document.getElementById('mov-tipo');

            const desc = descInput.value.trim();
            const monto = parseFloat(montoInput.value);
            const tipo = tipoInput.value;

            if (desc !== "" && !isNaN(monto) && monto > 0) {
                const nuevo = {
                    id: Date.now(),
                    desc: desc,
                    monto: monto,
                    tipo: tipo,
                    fecha: new Date().toISOString()
                };
                
                movimientos.push(nuevo);
                localStorage.setItem('alma_movimientos', JSON.stringify(movimientos));
                
                // Limpiar inputs
                descInput.value = "";
                montoInput.value = "";
                
                actualizarTodo();
            } else {
                alert("Por favor, ingresa una descripción y un monto válido.");
            }
        }

        function cambiarFiltro(tipo, btn) {
            filtroActual = tipo;
            document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            actualizarTodo();
        }

        function actualizarTodo() {
            const ahora = new Date();
            const filtrados = movimientos.filter(m => {
                const fechaM = new Date(m.fecha);
                const difDias = (ahora - fechaM) / (1000 * 60 * 60 * 24);
                if (filtroActual === 'semana') return difDias <= 7;
                if (filtroActual === 'mes') return difDias <= 30;
                if (filtroActual === 'año') return difDias <= 365;
                return true;
            });

            const lista = document.getElementById('listaMovimientos');
            let totalI = 0, totalG = 0;
            lista.innerHTML = '';

            filtrados.slice().reverse().forEach(m => {
                if (m.tipo === 'ingreso') totalI += m.monto;
                else totalG += m.monto;

                lista.innerHTML += `
                    <div class="item ${m.tipo}">
                        <span><strong>${m.desc}</strong><br><small>${new Date(m.fecha).toLocaleDateString()}</small></span>
                        <span style="color: ${m.tipo === 'ingreso' ? 'green' : 'red'}">
                            ${m.tipo === 'ingreso' ? '+' : '-'}$${m.monto.toLocaleString()}
                        </span>
                    </div>
                `;
            });

            document.getElementById('res-ingresos').innerText = `$${totalI.toLocaleString()}`;
            document.getElementById('res-gastos').innerText = `$${totalG.toLocaleString()}`;
            
            actualizarGrafico(totalI, totalG);
        }

        function actualizarGrafico(i, g) {
            const ctx = document.getElementById('chartMovimientos').getContext('2d');
            if (miChart) miChart.destroy();
            miChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Ingresos', 'Gastos'],
                    datasets: [{
                        data: [i, g],
                        backgroundColor: ['#22c55e', '#ef4444']
                    }]
                },
                options: { plugins: { legend: { display: false } } }
            });
        }

        function contactarVendedor() {
            const email = document.getElementById('cliente-email').value;
            const telefono = "573000000000"; // 🚩 CAMBIA ESTO POR TU NÚMERO REAL
            if (!email.includes("@")) { alert("Ingresa un email válido"); return; }
            const msj = encodeURIComponent(`¡Hola! Quiero la Guía PDF. Mi correo es: ${email}`);
            window.open(`https://wa.me/${telefono}?text=${msj}`, '_blank');
        }

        function descargarPDF() {
            const element = document.getElementById('app-area');
            const opt = {
                margin: 10,
                filename: 'Mi_Reporte_Finanzas.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }

        window.onload = actualizarTodo;
    </script>
</body>
</html>
